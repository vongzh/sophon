name: Android Build & Release

# 触发方式：
#   1. 推送 v* 标签（如 v0.1.0）→ 自动构建 + 发布 Release
#   2. 推送 master 分支 → 自动构建并归档 APK Artifact
#   3. 手动触发（Actions 页 Run workflow）→ 构建并上传 artifact，勾选 publish 才发 Release
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布用的标签名（留空则只构建、不发布）'
        required: false
        default: ''
      publish:
        description: '构建后发布到 Release'
        type: boolean
        default: false

# softprops/action-gh-release 创建 Release 需要写权限
permissions:
  contents: write

# 同一分支 / 标签的重复触发自动取消，避免并发抢锁
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 使用 Temurin JDK 21 构建
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # gradle/actions/setup-gradle 自带 wrapper 校验 + 依赖缓存
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 先算出版本号，并把「标签 vs versionName」的一致性卡在构建之前（失败要快）
      - name: Resolve version
        id: ver
        run: |
          set -e
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          VCODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          [ -n "$VERSION" ] || { echo "❌ 未能从 app/build.gradle.kts 解析 versionName"; exit 1; }
          [ -n "$VCODE" ]   || { echo "❌ 未能从 app/build.gradle.kts 解析 versionCode"; exit 1; }

          # 发布用的 ref：标签触发取标签名，手动触发取输入的 tag（可能为空 = 只构建）
          REF="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          if [ -n "$REF" ]; then
            TAGVER="${REF#v}"
            if [ "$TAGVER" != "$VERSION" ]; then
              echo "❌ 标签版本($TAGVER) 与 versionName($VERSION) 不一致"
              echo "   请先改 app/build.gradle.kts 的 versionName/versionCode，再打对应标签"
              exit 1
            fi
          fi

          # 文件名始终带版本号；非标签构建再补 commit 短 SHA 便于区分
          if [ -n "$REF" ]; then
            NAME="Sophon-${VERSION}.apk"
          else
            NAME="Sophon-${VERSION}-${GITHUB_SHA::7}.apk"
          fi

          {
            echo "VERSION=$VERSION"
            echo "VCODE=$VCODE"
            echo "REF=$REF"
            echo "APK_NAME=$NAME"
          } >> "$GITHUB_ENV"
          {
            echo "version=$VERSION"
            echo "vcode=$VCODE"
            echo "ref=$REF"
            echo "apk_name=$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "版本 name=$VERSION code=$VCODE ref=${REF:-（仅构建）} 产物名=$NAME"

      # 签名密钥库检查：优先支持 GitHub Secrets 自定义签名，若未提供则使用仓库内置 release.jks
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/sophon-release.jks"
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "USE_CUSTOM_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "✅ 已从 GitHub Secrets 还原签名密钥库"
          elif [ -f "keystore/release.jks" ]; then
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "USE_CUSTOM_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "✅ 使用仓库内置签名密钥库 (keystore/release.jks)"
          else
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "⚠️ 未配置签名密钥库"
          fi

      # 未签名 APK 无法在车机安装，要发布 Release 时必须有有效签名
      - name: Require signing for publish
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.publish && inputs.tag != '')
        run: |
          if [ "$SIGNING_READY" != "true" ]; then
            echo "❌ 本次要发布 Release，但没有有效签名，产出的未签名 APK 无法在车机安装。"
            exit 1
          fi

      - name: Build release APK
        env:
          SOPHON_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SOPHON_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SOPHON_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "$USE_CUSTOM_KEYSTORE" = "true" ]; then
            export SOPHON_KEYSTORE_PATH="$GITHUB_WORKSPACE/sophon-release.jks"
          fi
          ./gradlew :app:assembleRelease --stacktrace

      - name: Collect & verify APK
        run: |
          set -e
          mkdir -p dist

          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "❌ 未找到 APK 产物"; exit 1; }
          cp "$APK" "dist/$APK_NAME"

          # 校验 APK 包名、启动 Activity 与 versionName
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          AAPT="$ANDROID_HOME/build-tools/$BT/aapt2"
          BADGING=$("$AAPT" dump badging "dist/$APK_NAME")
          echo "$BADGING" | head -4
          echo "$BADGING" | grep -q "package: name='com.vongzh.sophon'" \
            || { echo "❌ 包名不是 com.vongzh.sophon"; exit 1; }
          echo "$BADGING" | grep -q "launchable-activity: name='com.vongzh.sophon.ui.MainActivity'" \
            || { echo "❌ 启动 Activity 不符"; exit 1; }
          echo "$BADGING" | grep -q "versionName='$VERSION'" \
            || { echo "❌ APK 内 versionName 与 $VERSION 不符"; exit 1; }

          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sophon-apk-${{ steps.ver.outputs.version }}
          path: dist/*.apk
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.publish && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          tag_name: ${{ steps.ver.outputs.ref }}
          name: ${{ steps.ver.outputs.ref }}
          body: |
            极视 Sophon 车载行车记录仪与哨兵系统 ${{ steps.ver.outputs.ref }}

            - 版本：`${{ steps.ver.outputs.version }}`（versionCode `${{ steps.ver.outputs.vcode }}`）
            - 产物：`${{ steps.ver.outputs.apk_name }}`
            - 签名：车规正式密钥库签名

            安装命令：
            ```bash
            adb install -r ${{ steps.ver.outputs.apk_name }}
            ```
            系统要求：Android 9.0+ (API 28+)，推荐 Android 11+ (Flyme Auto / ECARX)
